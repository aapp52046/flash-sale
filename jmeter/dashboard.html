<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Sale 即時監控</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --dim:#8b949e; --green:#3fb950; --red:#f85149; --yellow:#d29922;
    --blue:#58a6ff; --purple:#bc8cff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding:16px; }
  h1 { font-size:20px; font-weight:600; }
  .topbar { display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .badge { padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .badge.ok   { background:#12261a; color:var(--green); border:1px solid var(--green); }
  .badge.warn { background:#2d2411; color:var(--yellow); border:1px solid var(--yellow); }
  .badge.err  { background:#2d1312; color:var(--red); border:1px solid var(--red); }
  .badge.run  { background:#12261a; color:var(--green); border:1px solid var(--green); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  button { background:var(--blue); color:#04203a; border:none; border-radius:6px; padding:7px 16px;
           font-weight:600; cursor:pointer; font-size:13px; }
  button.danger { background:var(--red); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .card .k { color:var(--dim); font-size:12px; margin-bottom:6px; }
  .card .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .card .v.small { font-size:20px; }
  .card .sub { color:var(--dim); font-size:11px; margin-top:4px; }
  .row { display:grid; grid-template-columns:2fr 1fr; gap:10px; margin-bottom:14px; }
  @media (max-width:900px){ .row{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .panel h2 { font-size:13px; color:var(--dim); margin-bottom:8px; font-weight:600; }
  canvas { width:100%; height:220px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel); }
  .code200{color:var(--green);font-weight:700;} .code409{color:var(--purple);}
  .code429{color:var(--yellow);} .code500{color:var(--red);}
  .logbox { font-family:Consolas,monospace; font-size:11px; color:var(--dim); max-height:150px; overflow:auto; white-space:pre-wrap; }
  .progress { height:10px; background:#21262d; border-radius:5px; overflow:hidden; margin-top:6px; }
  .progress > div { height:100%; background:var(--green); width:0%; transition:width .4s; }
  .mini { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  input { background:#0d1117; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; width:80px; }
  .muted{color:var(--dim); font-size:12px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>⚡ Flash Sale 即時監控</h1>
  <span id="appBadge" class="badge err">APP 離線</span>
  <span id="runBadge" class="badge">待命</span>
  <div style="flex:1"></div>
  <div class="mini">
    <span class="muted">Users</span><input id="inUsers" type="number" value="500">
    <span class="muted">Stock</span><input id="inStock" type="number" value="100">
  </div>
  <button id="btnReset" style="background:var(--yellow);color:#1c1400;">⟳ 重置庫存</button>
  <button id="btnStart">▶ 開始壓測</button>
  <button id="btnStop" class="danger" disabled>■ 停止</button>
</div>

<div class="cards">
  <div class="card"><div class="k">📦 訂單數</div><div id="orders" class="v">0</div>
    <div class="progress"><div id="ordersBar"></div></div>
    <div class="sub">目標 <span id="target">100</span></div></div>
  <div class="card"><div class="k">🗄 DB 庫存</div><div id="dbStock" class="v">-</div><div class="sub">source of truth</div></div>
  <div class="card"><div class="k">⚡ Redis 庫存</div><div id="redisStock" class="v">-</div><div class="sub">hot counter</div></div>
  <div class="card"><div class="k">🔒 防重 Key</div><div id="dedup" class="v small">-</div><div class="sub">flash:dedup:*</div></div>
  <div class="card"><div class="k">🚀 每秒請求</div><div id="rps" class="v small">0</div><div class="sub">last 1s</div></div>
  <div class="card"><div class="k">⏱ 平均 / P99 延遲</div><div id="lat" class="v small">0 / 0</div><div class="sub">ms</div></div>
</div>

<div class="row">
  <div class="panel"><h2>📈 訂單累積 vs 時間</h2><canvas id="chart"></canvas></div>
  <div class="panel"><h2>🧩 回應碼分布</h2>
    <table>
      <tr><th>代碼</th><th>數量</th><th>說明</th></tr>
      <tr><td class="code200">200</td><td id="c200">0</td><td class="muted">搶購成功</td></tr>
      <tr><td class="code409">409</td><td id="c409">0</td><td class="muted">重複下單</td></tr>
      <tr><td class="code429">429</td><td id="c429">0</td><td class="muted">已售罄</td></tr>
      <tr><td class="code500">500</td><td id="c500">0</td><td class="muted">伺服器錯誤</td></tr>
    </table>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h2>🕒 即時事件串流（最近 60 筆）</h2>
    <div style="max-height:260px;overflow:auto">
    <table>
      <thead><tr><th>時間</th><th>帳號</th><th>代碼</th><th>訊息</th><th>延遲</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
    </div>
  </div>
  <div class="panel"><h2>📜 控制台</h2><div id="log" class="logbox"></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let canvas, ctx;

function drawChart(points) {
  if (!ctx) { canvas = $('chart'); canvas.width = canvas.clientWidth * 2; canvas.height = 220 * 2;
    ctx = canvas.getContext('2d'); ctx.scale(2,2); }
  const W = canvas.width/2, H = canvas.height/2;
  ctx.clearRect(0,0,W,H);
  const maxX = Math.max(points.length, 1);
  const maxV = Math.max(...points.map(p=>p.orders), 1);
  ctx.strokeStyle='#30363d'; ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif';
  for (let i=0;i<=4;i++){
    const y = H - 10 - (H-30) * i/4;
    ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-5,y); ctx.stroke();
    ctx.fillText(Math.round(maxV*i/4), 4, y+3);
  }
  ctx.strokeStyle='#3fb950'; ctx.lineWidth=2; ctx.beginPath();
  points.forEach((p,i)=>{
    const x = 30 + (W-35) * (i/(Math.max(maxX-1,1)));
    const y = H - 10 - (H-30) * (p.orders/maxV);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle='#58a6ff';
  points.forEach((p,i)=>{
    const x = 30 + (W-35) * (i/(Math.max(maxX-1,1)));
    const y = H - 10 - (H-30) * (p.orders/maxV);
    ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
  });
}

function badge(el, text, cls){ el.textContent = text; el.className = 'badge ' + cls; }

async function refresh(){
  let s;
  try { s = await (await fetch('/api/state')).json(); }
  catch(e){ return; }
  badge($('appBadge'), s.app_alive ? 'APP 在線' : 'APP 離線', s.app_alive ? 'ok' : 'err');
  badge($('runBadge'), s.running ? '壓測進行中' : (s.orders>0 ? '已完成' : '待命'), s.running ? 'run' : (s.orders>0?'ok':'warn'));
  $('btnStart').disabled = s.running;
  $('btnStop').disabled = !s.running;
  $('orders').textContent = s.orders;
  $('target').textContent = s.target;
  $('ordersBar').style.width = Math.min(100, s.target? s.orders/s.target*100 : 0) + '%';
  $('dbStock').textContent = s.db_stock;
  $('redisStock').textContent = s.redis_stock;
  $('dedup').textContent = s.dedup;
  $('rps').textContent = s.req_per_sec;
  $('lat').textContent = s.avg_ms + ' / ' + s.p99_ms;
  $('c200').textContent = s.codes['200']||0;
  $('c409').textContent = s.codes['409']||0;
  $('c429').textContent = s.codes['429']||0;
  $('c500').textContent = s.codes['500']||0;
  drawChart(s.timeline);
  const ev = s.events.slice(0,60);
  $('events').innerHTML = ev.map(e=>`<tr>
    <td>${e.t}</td><td>${e.user}</td>
    <td class="code${e.code}">${e.code}</td>
    <td>${e.msg}</td><td>${e.ms}ms</td></tr>`).join('') || '<tr><td colspan="5" class="muted">等待請求…</td></tr>';
  $('log').textContent = (s.log||[]).slice(0,40).join('\n');
}

$('btnStart').onclick = async ()=>{
  await fetch('/start', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({users:+$('inUsers').value, stock:+$('inStock').value})});
};
$('btnReset').onclick = async ()=>{
  await fetch('/reset', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({stock:+$('inStock').value})});
};
$('btnStop').onclick = async ()=>{ await fetch('/stop', {method:'POST'}); };

setInterval(refresh, 500);
refresh();
</script>
</body>
</html>
