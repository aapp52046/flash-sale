<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Sale 即時監控</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --dim:#8b949e; --green:#3fb950; --red:#f85149;
    --yellow:#d29922; --blue:#58a6ff; --purple:#bc8cff; --cyan:#39c5cf;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding:16px; min-height:100vh; }
  h1 { font-size:20px; font-weight:600; letter-spacing:.2px; }
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .badge { padding:3px 12px; border-radius:12px; font-size:12px; font-weight:600; }
  .badge.ok   { background:#12261a; color:var(--green); border:1px solid var(--green); }
  .badge.warn { background:#2d2411; color:var(--yellow); border:1px solid var(--yellow); }
  .badge.err  { background:#2d1312; color:var(--red); border:1px solid var(--red); }
  .badge.run  { background:#12261a; color:var(--green); border:1px solid var(--green); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.5; } }
  button { background:var(--blue); color:#04203a; border:none; border-radius:6px; padding:7px 16px;
           font-weight:600; cursor:pointer; font-size:13px; transition:filter .15s; }
  button:hover:not(:disabled){ filter:brightness(1.15); }
  button.danger { background:var(--red); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .card .k { color:var(--dim); font-size:12px; margin-bottom:6px; }
  .card .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .card .v.small { font-size:20px; }
  .card .sub { color:var(--dim); font-size:11px; margin-top:4px; }
  .row { display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:960px){ .row{ grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .panel h2 { font-size:13px; color:var(--dim); margin-bottom:10px; font-weight:600; }
  .chart-wrap { position:relative; }
  canvas { display:block; width:100%; }
  .legend { position:absolute; top:0; right:0; display:flex; gap:14px; font-size:11px; color:var(--dim); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .dot { width:9px; height:9px; border-radius:2px; display:inline-block; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel2); }
  tbody tr:hover { background:#21262d; }
  .code200{color:var(--green);font-weight:700;} .code409{color:var(--purple);}
  .code429{color:var(--yellow);} .code500{color:var(--red);} .code0{color:var(--dim);}
  .logbox { font-family:Consolas,monospace; font-size:11px; color:var(--dim); max-height:320px; overflow:auto; white-space:pre-wrap; }
  .progress { height:10px; background:#21262d; border-radius:5px; overflow:hidden; margin-top:6px; }
  .progress > div { height:100%; background:var(--green); width:0%; transition:width .4s; }
  .mini { display:flex; gap:8px; align-items:center; }
  input { background:#0d1117; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; width:80px; }
  .muted{color:var(--dim); font-size:12px;}
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  .tab { background:transparent; color:var(--dim); border:1px solid var(--border); border-radius:16px;
         padding:4px 12px; font-size:12px; font-weight:500; cursor:pointer; }
  .tab.active { background:var(--blue); color:#04203a; border-color:var(--blue); font-weight:600; }
  .tab .n { opacity:.75; margin-left:4px; }
  .summary { display:flex; gap:18px; margin-bottom:10px; flex-wrap:wrap; font-size:13px; align-items:center; }
  .summary b { font-variant-numeric:tabular-nums; }
  .sc { display:inline-flex; align-items:center; gap:6px; }
  .tablewrap { max-height:300px; overflow:auto; border:1px solid var(--border); border-radius:6px; }
  .elapsed { color:var(--dim); font-size:11px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>⚡ Flash Sale 即時監控</h1>
  <span id="appBadge" class="badge err">APP 離線</span>
  <span id="runBadge" class="badge">待命</span>
  <span id="timer" class="elapsed"></span>
  <div style="flex:1"></div>
  <div class="mini">
    <span class="muted">Users</span><input id="inUsers" type="number" value="500">
    <span class="muted">Stock</span><input id="inStock" type="number" value="100">
  </div>
  <button id="btnReset" style="background:var(--yellow);color:#1c1400;">⟳ 重置</button>
  <button id="btnStart">▶ 開始壓測</button>
  <button id="btnStop" class="danger" disabled>■ 停止</button>
</div>

<div class="cards">
  <div class="card"><div class="k">📦 訂單數</div><div id="orders" class="v">0</div>
    <div class="progress"><div id="ordersBar"></div></div>
    <div class="sub">目標 <span id="target">100</span></div></div>
  <div class="card"><div class="k">🗄 DB 庫存</div><div id="dbStock" class="v">-</div><div class="sub">唯一事實來源</div></div>
  <div class="card"><div class="k">⚡ Redis 庫存</div><div id="redisStock" class="v">-</div><div class="sub">熱路徑計數器</div></div>
  <div class="card"><div class="k">🔒 防重 Key</div><div id="dedup" class="v small">-</div><div class="sub">flash:dedup:*</div></div>
  <div class="card"><div class="k">🚀 每秒請求</div><div id="rps" class="v small">0</div><div class="sub">last 1s</div></div>
  <div class="card"><div class="k">⏱ 延遲 avg / p50 / p99</div><div id="lat" class="v small">- / - / -</div><div class="sub">ms</div></div>
</div>

<div class="row">
  <div class="panel">
    <h2>📈 訂單累積 vs 時間</h2>
    <div class="chart-wrap">
      <div class="legend">
        <span><i class="dot" style="background:var(--blue)"></i>總請求</span>
        <span><i class="dot" style="background:var(--green)"></i>成功訂單</span>
        <span><i class="dot" style="background:var(--yellow)"></i>目標庫存</span>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </div>
  <div class="panel"><h2>🧩 回應碼分布</h2>
    <table>
      <tr><th>代碼</th><th>數量</th><th>說明</th></tr>
      <tr><td class="code200">200</td><td id="c200">0</td><td class="muted">搶購成功</td></tr>
      <tr><td class="code409">409</td><td id="c409">0</td><td class="muted">重複下單</td></tr>
      <tr><td class="code429">429</td><td id="c429">0</td><td class="muted">已售罄</td></tr>
      <tr><td class="code500">500</td><td id="c500">0</td><td class="muted">伺服器錯誤</td></tr>
    </table>
  </div>
</div>

<div class="row">
  <div class="panel">
    <h2>🕒 即時事件串流</h2>
    <div class="summary" id="summary"></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-f="all">全部 <span class="n" id="nAll">0</span></button>
      <button class="tab" data-f="200">成功 <span class="n" id="n200">0</span></button>
      <button class="tab" data-f="409">重複 <span class="n" id="n409">0</span></button>
      <button class="tab" data-f="429">售罄 <span class="n" id="n429">0</span></button>
      <button class="tab" data-f="500">錯誤 <span class="n" id="n500">0</span></button>
    </div>
    <div class="tablewrap">
    <table>
      <thead><tr><th>時間</th><th>帳號</th><th>代碼</th><th>訊息</th><th>延遲</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
    </div>
  </div>
  <div class="panel"><h2>📜 控制台</h2><div id="log" class="logbox"></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let canvas, ctx, cw = 0;
let filter = 'all';

function setupCanvas(){
  canvas = $('chart');
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;
  const dpr = window.devicePixelRatio || 1;
  cw = rect.width; const ch = 260;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
  canvas.style.height = ch + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', ()=>{ setupCanvas(); });

function drawChart(series, target){
  if (!ctx) { setupCanvas(); if (!ctx) return; }
  const W = cw, H = 260, padL = 40, padR = 12, padT = 12, padB = 24;
  ctx.clearRect(0,0,W,H);
  if (!series.length) {
    ctx.fillStyle='#8b949e'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('等待壓測資料…', W/2, H/2); ctx.textAlign='left';
    return;
  }
  const maxT = series[series.length-1][0];
  const maxV = Math.max(target, ...series.map(p=>p[2]));
  const gx = (t)=> padL + (W-padL-padR) * (t/maxT);
  const gy = (v)=> H-padB - (H-padT-padB) * (v/maxV);

  ctx.strokeStyle='#21262d'; ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif';
  for (let i=0;i<=4;i++){
    const y = padT + (H-padT-padB)*i/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(Math.round(maxV*(1-i/4)), 2, y+3);
  }
  ctx.fillText('0', 2, H-padB+3);
  ctx.fillText(maxT.toFixed(1)+'s', W-padR-24, H-padB+14);

  // target dashed line
  ctx.setLineDash([5,4]); ctx.strokeStyle='#d29922'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,gy(target)); ctx.lineTo(W-padR,gy(target)); ctx.stroke();
  ctx.setLineDash([]);

  function line(key, color){
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    series.forEach((p,i)=>{
      const x=gx(p[0]), y=gy(p[key]);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    if (key===1){
      ctx.lineTo(gx(maxT),H-padB); ctx.lineTo(gx(0),H-padB); ctx.closePath();
      ctx.globalAlpha=.12; ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1;
    }
  }
  line(2,'#58a6ff');
  line(1,'#3fb950');
}

function badge(el, text, cls){ el.textContent = text; el.className = 'badge ' + cls; }

function fmt(ms){ return ms? ms+'ms' : '-'; }

async function refresh(){
  let s;
  try { s = await (await fetch('/api/state')).json(); }
  catch(e){ return; }
  badge($('appBadge'), s.app_alive ? 'APP 在線' : 'APP 離線', s.app_alive ? 'ok' : 'err');
  badge($('runBadge'), s.running ? '壓測進行中' : (s.orders>0 ? '已完成' : '待命'), s.running ? 'run' : (s.orders>0?'ok':'warn'));
  $('btnStart').disabled = s.running;
  $('btnStop').disabled = !s.running;
  if (s.start_ts){
    const e = Math.max(0, (Date.now()/1000) - s.start_ts);
    $('timer').textContent = '⏱ ' + e.toFixed(0) + 's';
  } else $('timer').textContent = '';
  $('orders').textContent = s.orders;
  $('target').textContent = s.target;
  $('ordersBar').style.width = Math.min(100, s.target? s.orders/s.target*100 : 0) + '%';
  $('dbStock').textContent = s.db_stock;
  $('redisStock').textContent = s.redis_stock;
  $('dedup').textContent = s.dedup;
  $('rps').textContent = s.req_per_sec;
  $('lat').textContent = (s.avg_ms||'-') + ' / ' + (s.p50_ms||'-') + ' / ' + (s.p99_ms||'-');
  $('c200').textContent = s.codes['200']||0;
  $('c409').textContent = s.codes['409']||0;
  $('c429').textContent = s.codes['429']||0;
  $('c500').textContent = s.codes['500']||0;
  $('n200').textContent = s.codes['200']||0;
  $('n409').textContent = s.codes['409']||0;
  $('n429').textContent = s.codes['429']||0;
  $('n500').textContent = s.codes['500']||0;

  const total = (s.codes['200']||0)+(s.codes['409']||0)+(s.codes['429']||0)+(s.codes['500']||0);
  $('nAll').textContent = total;
  const succ = s.codes['200']||0;
  const rate = total? (succ/total*100).toFixed(1) : '0';
  $('summary').innerHTML =
    '<span class="sc"><b style="color:var(--green)">成功 '+succ+'</b></span>' +
    '<span class="sc"><b style="color:var(--purple)">重複 '+(s.codes['409']||0)+'</b></span>' +
    '<span class="sc"><b style="color:var(--yellow)">售罄 '+(s.codes['429']||0)+'</b></span>' +
    '<span class="sc"><b style="color:var(--red)">錯誤 '+(s.codes['500']||0)+'</b></span>' +
    '<span class="muted">成功率 '+rate+'%</span>';

  drawChart(s.series||[], s.target);

  const all = s.events||[];
  const ev = filter==='all' ? all : all.filter(e=>String(e.code)===String(filter));
  $('events').innerHTML = ev.map(e=>`<tr>
    <td>${e.t}</td><td>${e.user}</td>
    <td class="code${e.code}">${e.code===0?'-':e.code}</td>
    <td>${e.msg}</td><td>${fmt(e.ms)}</td></tr>`).join('') ||
      '<tr><td colspan="5" class="muted">等待請求…</td></tr>';
  $('log').textContent = (s.log||[]).slice(0,40).join('\n');
}

$('tabs').addEventListener('click', (e)=>{
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  filter = t.dataset.f;
  refresh();
});

$('btnStart').onclick = async ()=>{
  await fetch('/start', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({users:+$('inUsers').value, stock:+$('inStock').value})});
};
$('btnReset').onclick = async ()=>{
  await fetch('/reset', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({stock:+$('inStock').value})});
};
$('btnStop').onclick = async ()=>{ await fetch('/stop', {method:'POST'}); };

setInterval(refresh, 400);
refresh();
</script>
</body>
</html>
