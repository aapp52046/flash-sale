<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒殺商品列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/flash">秒殺系統</a>
        <div class="navbar-nav ms-auto">
            <span class="nav-link text-light" th:text="${username}">用戶</span>
            <a class="nav-link" href="/orders">我的訂單</a>
            <a class="nav-link" href="#" onclick="logout()">登出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>秒殺商品</h2>
    <div class="row mt-3" id="productList">
        <div th:each="fp : ${flashProducts}" class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${fp.productName != null ? fp.productName : '商品 #' + fp.productId}">商品名稱</h5>
                    <p class="card-text">
                        <span class="text-danger fs-4" th:text="'$' + fp.flashPrice">秒殺價</span>
                        <br>
                        庫存: <span th:text="${fp.flashStock}">0</span>
                    </p>
                    <p class="card-text">
                        <small class="text-muted" th:text="${#temporals.format(fp.startTime, 'yyyy-MM-dd HH:mm')}"></small>
                        -
                        <small class="text-muted" th:text="${#temporals.format(fp.endTime, 'yyyy-MM-dd HH:mm')}"></small>
                    </p>
                    <span class="badge" th:classappend="${fp.status == 1 ? 'bg-success' : 'bg-secondary'}"
                          th:text="${fp.status == 1 ? '進行中' : '即將開始'}">狀態</span>
                </div>
                <div class="card-footer">
                    <a th:href="@{/flash/{id}(id=${fp.id})}" class="btn btn-danger w-100">查看詳情</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function logout() {
    localStorage.removeItem('jwt_token');
    localStorage.removeItem('username');
    document.cookie = 'jwt=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    window.location.href = '/login';
}
</script>
</body>
</html>
