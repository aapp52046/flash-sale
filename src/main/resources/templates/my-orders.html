<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的訂單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${username}, 'orders', false)}"></div>

<div class="container mt-4">
    <h2>我的訂單</h2>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>訂單編號</th>
                <th>秒殺商品ID</th>
                <th>數量</th>
                <th>金額</th>
                <th>時間</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody id="orderTableBody">
            <tr><td colspan="6" class="text-center">載入中...</td></tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem('jwt_token');

async function loadOrders() {
    const tbody = document.getElementById('orderTableBody');
    try {
        const res = await fetch('/api/flash/orders/my', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        if (data.code === 401) {
            window.location.href = '/login';
            return;
        }

        if (!data.data || data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">尚無訂單</td></tr>';
            return;
        }

        tbody.innerHTML = data.data.map(o => `
            <tr>
                <td><code>${o.orderNo}</code></td>
                <td>${o.flashProductId}</td>
                <td>${o.quantity}</td>
                <td>$${o.amount}</td>
                <td>${new Date(o.createdAt).toLocaleString()}</td>
                <td><span class="badge bg-success">已建立</span></td>
            </tr>
        `).join('');

    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">載入失敗</td></tr>';
    }
}

loadOrders();
</script>
</body>
</html>
