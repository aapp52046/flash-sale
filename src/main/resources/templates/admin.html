<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒殺系統 - 管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${username}, 'admin', true)}"></div>

<div class="container mt-4">
    <div id="alert" class="alert d-none"></div>

    <div class="card shadow mb-4">
        <div class="card-header">建立秒殺活動</div>
        <div class="card-body">
            <form id="createForm" class="row g-3">
                <div class="col-md-4">
                    <label for="productId" class="form-label">商品</label>
                    <select id="productId" class="form-select" required></select>
                </div>
                <div class="col-md-2">
                    <label for="flashPrice" class="form-label">秒殺價</label>
                    <input type="number" id="flashPrice" class="form-control" step="0.01" min="0" required>
                </div>
                <div class="col-md-2">
                    <label for="flashStock" class="form-label">庫存</label>
                    <input type="number" id="flashStock" class="form-control" min="1" required>
                </div>
                <div class="col-md-2">
                    <label for="startTime" class="form-label">開始時間</label>
                    <input type="datetime-local" id="startTime" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label for="endTime" class="form-label">結束時間</label>
                    <input type="datetime-local" id="endTime" class="form-control" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">建立活動</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header">秒殺活動列表</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0 align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>商品</th>
                        <th>秒殺價</th>
                        <th>庫存</th>
                        <th>時間</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="flashTable">
                    <tr><td colspan="7" class="text-center">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const token = localStorage.getItem('jwt_token');
const flashStatus = { 0: '未開始', 1: '進行中', 2: '已結束' };
const flashBadge = { 0: 'bg-secondary', 1: 'bg-success', 2: 'bg-dark' };

function showAlert(type, msg) {
    const alert = document.getElementById('alert');
    alert.className = 'alert alert-' + type;
    alert.textContent = msg;
    alert.classList.remove('d-none');
    setTimeout(() => alert.classList.add('d-none'), 3000);
}

async function api(url, options = {}) {
    const res = await fetch(url, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            ...(options.headers || {})
        }
    });
    if (res.status === 403) {
        window.location.href = '/flash';
        throw new Error('無權限');
    }
    return res.json();
}

async function loadProducts() {
    const data = await api('/api/admin/products');
    const sel = document.getElementById('productId');
    sel.innerHTML = data.data.map(p =>
        `<option value="${p.id}">#${p.id} ${p.name} (庫存${p.totalStock})</option>`).join('');
    return data.data;
}

async function loadFlashProducts(products) {
    const data = await api('/api/admin/flash/products');
    const tbody = document.getElementById('flashTable');
    if (!data.data || data.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">尚無秒殺活動</td></tr>';
        return;
    }
    tbody.innerHTML = data.data.map(f => {
        const name = products.find(p => p.id === f.productId);
        const statusTxt = flashStatus[f.status] || '未知';
        const badge = flashBadge[f.status] || 'bg-secondary';
        const endBtn = f.status === 1
            ? `<button class="btn btn-sm btn-outline-dark" onclick="setStatus(${f.id}, 2)">結束</button>`
            : (f.status === 2 ? '' : `<button class="btn btn-sm btn-success" onclick="setStatus(${f.id}, 1)">發布</button>`);
        return `
            <tr>
                <td>${f.id}</td>
                <td>${name ? name.name : '商品 #' + f.productId}</td>
                <td>$${f.flashPrice}</td>
                <td>${f.flashStock}</td>
                <td>${new Date(f.startTime).toLocaleString()}<br>
                    <small class="text-muted">~ ${new Date(f.endTime).toLocaleString()}</small></td>
                <td><span class="badge ${badge}">${statusTxt}</span></td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="preheat(${f.id})">預熱庫存</button>
                    ${endBtn}
                </td>
            </tr>`;
    }).join('');
}

async function preheat(id) {
    try {
        const data = await api(`/api/admin/flash/products/${id}/preheat`, { method: 'POST' });
        showAlert('success', data.message);
    } catch (e) { /* 已跳轉 */ }
}

async function setStatus(id, status) {
    try {
        const data = await api(`/api/admin/flash/products/${id}/status?status=${status}`, { method: 'PUT' });
        showAlert('success', data.message);
        init();
    } catch (e) { /* 已跳轉 */ }
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
        const body = {
            productId: parseInt(document.getElementById('productId').value),
            flashPrice: parseFloat(document.getElementById('flashPrice').value),
            flashStock: parseInt(document.getElementById('flashStock').value),
            startTime: document.getElementById('startTime').value,
            endTime: document.getElementById('endTime').value
        };
        const data = await api('/api/admin/flash/products', { method: 'POST', body: JSON.stringify(body) });
        if (data.code === 200) {
            showAlert('success', '建立成功，別忘了預熱庫存');
            e.target.reset();
            init();
        } else {
            showAlert('danger', data.message || '建立失敗');
        }
    } catch (err) {
        showAlert('danger', '網路錯誤，請重試');
    } finally {
        btn.disabled = false;
    }
});

async function init() {
    const products = await loadProducts();
    await loadFlashProducts(products);
}

init();
</script>
</body>
</html>
