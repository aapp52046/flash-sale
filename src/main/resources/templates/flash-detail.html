<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'秒殺 - 商品 #' + ${flashProduct.productId}">秒殺商品詳情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .countdown { font-size: 3rem; font-weight: bold; color: #dc3545; }
        .seckill-btn { font-size: 1.5rem; padding: 1rem 3rem; }
        .stock-badge { font-size: 1.2rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/flash">秒殺系統</a>
        <div class="navbar-nav ms-auto">
            <span class="nav-link text-light" th:text="${username}">用戶</span>
            <a class="nav-link" href="/orders">我的訂單</a>
            <a class="nav-link" href="#" onclick="logout()">登出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <a href="/flash" class="btn btn-outline-secondary mb-3">← 返回列表</a>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <h2 th:text="'秒殺商品 #' + ${flashProduct.productId}">商品名稱</h2>
                    <h3 class="text-danger my-3" th:text="'$' + ${flashProduct.flashPrice}">NT$0</h3>

                    <div id="countdownBox" class="my-4">
                        <div id="countdown" class="countdown">--:--:--</div>
                        <div id="countdownLabel" class="text-muted">倒數計時</div>
                    </div>

                    <div id="resultBox" class="alert d-none mt-3"></div>

                    <div class="my-3">
                        <span>剩餘庫存：</span>
                        <span id="stockDisplay" class="stock-badge badge bg-warning text-dark"
                              th:text="${flashProduct.flashStock}">0</span>
                    </div>

                    <button id="btnSeckill" class="btn btn-danger seckill-btn" disabled>
                        等待秒殺開始...
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header">活動資訊</div>
                <div class="card-body">
                    <p>開始時間：<br>
                        <strong th:text="${#temporals.format(flashProduct.startTime, 'yyyy-MM-dd HH:mm:ss')}"></strong>
                    </p>
                    <p>結束時間：<br>
                        <strong th:text="${#temporals.format(flashProduct.endTime, 'yyyy-MM-dd HH:mm:ss')}"></strong>
                    </p>
                    <p>狀態：
                        <span class="badge" th:classappend="${flashProduct.status == 1 ? 'bg-success' : 'bg-secondary'}"
                              th:text="${flashProduct.status == 1 ? '進行中' : '尚未開始'}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const FLASH_PRODUCT_ID = /*[[${flashProduct.id}]]*/ 0;
    const START_TIME = /*[[${#temporals.format(flashProduct.startTime, "yyyy-MM-dd'T'HH:mm:ss")}]]*/ '';
    const END_TIME = /*[[${#temporals.format(flashProduct.endTime, "yyyy-MM-dd'T'HH:mm:ss")}]]*/ '';
    const STATUS = /*[[${flashProduct.status}]]*/ 0;
    /*]]>*/

    const startTime = new Date(START_TIME).getTime();
    const endTime = new Date(END_TIME).getTime();

    let isClicking = false;
    let currentStock = parseInt(document.getElementById('stockDisplay').textContent);

    // ═══ Layer 0: Countdown Timer ═══
    function updateCountdown() {
        const now = Date.now();
        const countdownEl = document.getElementById('countdown');
        const labelEl = document.getElementById('countdownLabel');
        const btn = document.getElementById('btnSeckill');

        if (now < startTime) {
            const diff = startTime - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            countdownEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            labelEl.textContent = '距離開始';
            btn.textContent = '等待秒殺開始...';
            btn.disabled = true;
            btn.className = 'btn btn-secondary seckill-btn';
        } else if (now >= startTime && now < endTime) {
            const diff = endTime - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            countdownEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            labelEl.textContent = '距離結束';
            if (currentStock > 0) {
                btn.textContent = '立即搶購';
                btn.disabled = false;
                btn.className = 'btn btn-danger seckill-btn';
            } else {
                btn.textContent = '已售罄';
                btn.disabled = true;
                btn.className = 'btn btn-secondary seckill-btn';
            }
        } else {
            countdownEl.textContent = '00:00:00';
            labelEl.textContent = '已結束';
            btn.textContent = '秒殺已結束';
            btn.disabled = true;
            btn.className = 'btn btn-secondary seckill-btn';
        }
    }

    // ═══ Layer 0: Seckill Button with throttle + disable ═══
    document.getElementById('btnSeckill').addEventListener('click', async () => {
        if (isClicking) return;                  // Throttle 1s
        isClicking = true;
        const btn = document.getElementById('btnSeckill');
        btn.disabled = true;                     // Gray-out
        btn.textContent = '搶購中...';
        const resultBox = document.getElementById('resultBox');

        const token = localStorage.getItem('jwt_token');
        try {
            const res = await fetch('/api/flash/orders', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ flashProductId: FLASH_PRODUCT_ID, quantity: 1 })
            });
            const data = await res.json();

            resultBox.classList.remove('d-none');

            if (data.code === 200) {
                resultBox.className = 'alert alert-success';
                resultBox.textContent = '搶購成功！訂單號：' + data.data.orderNo;
                currentStock--;
                document.getElementById('stockDisplay').textContent = currentStock;
                if (currentStock <= 0) {
                    btn.textContent = '已售罄';
                    btn.disabled = true;
                } else {
                    btn.textContent = '搶購成功！';
                    btn.className = 'btn btn-success seckill-btn';
                    btn.disabled = true;
                }
            } else if (data.code === 429) {
                resultBox.className = 'alert alert-warning';
                resultBox.textContent = '已售罄';
                btn.textContent = '已售罄';
                btn.className = 'btn btn-secondary seckill-btn';
                document.getElementById('stockDisplay').textContent = '0';
            } else if (data.code === 409) {
                resultBox.className = 'alert alert-info';
                resultBox.textContent = data.message;
                btn.textContent = '已參與過';
                btn.className = 'btn btn-secondary seckill-btn';
            } else {
                resultBox.className = 'alert alert-danger';
                resultBox.textContent = data.message || '搶購失敗';
                btn.disabled = false;            // Re-enable on unknown error
                btn.textContent = '立即搶購';
                btn.className = 'btn btn-danger seckill-btn';
            }
        } catch (err) {
            resultBox.classList.remove('d-none');
            resultBox.className = 'alert alert-danger';
            resultBox.textContent = '網路錯誤，請重試';
            btn.disabled = false;
            btn.textContent = '立即搶購';
            btn.className = 'btn btn-danger seckill-btn';
        } finally {
            // Cool-down: 2 seconds before can click again
            setTimeout(() => { isClicking = false; }, 2000);
        }
    });

    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('username');
        document.cookie = 'jwt=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        window.location.href = '/login';
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
