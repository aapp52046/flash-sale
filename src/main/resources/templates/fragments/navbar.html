<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
</head>
<body>
<div th:fragment="navbar(username, active, isAdmin)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/flash">秒殺系統</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link text-light" th:text="${username}">用戶</span>
                <a class="nav-link" th:if="${isAdmin}" th:href="@{/admin}"
                   th:classappend="${active == 'admin'} ? 'active' : ''">管理後台</a>
                <a class="nav-link" th:href="@{/orders}"
                   th:classappend="${active == 'orders'} ? 'active' : ''">我的訂單</a>
                <a class="nav-link" th:if="${isAdmin}" href="/flash">前台</a>
                <a class="nav-link" href="#" onclick="logout()">登出</a>
            </div>
        </div>
    </nav>
    <script th:inline="none">
    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('username');
        document.cookie = 'jwt=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        window.location.href = '/login';
    }
    </script>
</div>
</body>
</html>
